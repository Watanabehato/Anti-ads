name: android-build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 35 / build-tools 35.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-8.9-deps-v1

      # 与 docs/build.md 的“全量约定验证”完全一致：五模块单测 + 四模块 lint + 两个 APK + 两个测试 APK
      - name: Unit tests (5 modules)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :accessibility:testDebugUnitTest :hook:testDebugUnitTest :probe:testDebugUnitTest

      - name: Lint (4 Android modules)
        run: ./gradlew --no-daemon :app:lintDebug :accessibility:lintDebug :hook:lintDebug :probe:lintDebug

      - name: Assemble APKs and instrumentation test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :probe:assembleDebug :app:assembleDebugAndroidTest :probe:assembleDebugAndroidTest

      - name: Upload APKs and test APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            probe/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            probe/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
