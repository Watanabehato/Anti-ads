# 工程级 Gradle 配置（不含个人绝对路径；JDK/SDK 位置见 docs/build.md）
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=summary

# 本机网络对 maven 仓库存在间歇性 TLS 失败，提高 Gradle 传输层重试与超时（不影响依赖版本与来源）
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
